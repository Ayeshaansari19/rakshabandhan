<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Rakshabandhan Bro💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="page1-body">

    <div class="floating-decor decor1">💗</div>
    <div class="floating-decor decor2">🌸</div>
    <div class="floating-decor decor3">✨</div>
    <div class="floating-decor decor4">🧿</div>
    <div class="floating-decor decor5">💖</div>
    <div class="floating-decor decor6">🌷</div>

    <div class="page">

        <!-- Main Heading -->
        <h1>Happy Rakshabandhan Jay💗</h1>

        <p class="subtitle">
            To the best brother ever... 🥹✨
        </p>


        <!-- Cute Image Strip -->
        <div class="photo-strip">

            <div class="photo">
                <img src="images/pic1.jpeg" alt="Memory 1">
            </div>

            <div class="photo">
                <img src="images/pic2.jpeg" alt="Memory 2">
            </div>

            <div class="photo">
                <img src="images/pic3.jpeg" alt="Memory 3">
            </div>

            <div class="photo">
                <img src="images/pic4.jpeg" alt="Memory 4">
            </div>

            <div class="photo">
                <img src="images/pic5.jpeg" alt="Memory 5">
            </div>

        </div>


        <!-- Question -->
        <div class="question-box">

            <h2>Okay... one important question 🥺</h2>

            <p class="question">
                Do you love your sister? 👀💕
            </p>

            <div class="buttons">

                <button id="yesBtn" onclick="goToNextPage()">
                    YES 💗
                </button>

                <button id="noBtn">
                    NO 😒
                </button>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
